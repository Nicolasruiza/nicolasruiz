{ sec.day.order }}; display: {{ sec.day.disp }};\">\n        <!-- DAY ARC -->\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin: 24px 2px 10px;\">\n          <span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #8b95a3;\">Your day, as a curve<\u002Fspan>\n          <span style=\"font-size: 11px; color: #6b7585;\">solid = so far · dotted = forecast<\u002Fspan>\n        <\u002Fdiv>\n        <div data-hx-rise=\"2\" style=\"background: linear-gradient(160deg, #0e141d, #0c1219); border: 1px solid rgba(255,255,255,0.10); border-radius: 24px; padding: 16px 16px 12px; box-shadow: 0 18px 42px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05); position: relative; overflow: hidden;\">\n          <div style=\"position: relative;\">\n          <svg sc-camel-view-box=\"0 0 330 96\" width=\"100%\" height=\"96\" style=\"display: block;\">\n            <defs>\n              <linearGradient id=\"hxarc\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                <stop offset=\"0\" stop-color=\"#4DE1C4\" stop-opacity=\"0.28\"><\u002Fstop>\n                <stop offset=\"1\" stop-color=\"#4DE1C4\" stop-opacity=\"0\"><\u002Fstop>\n              <\u002FlinearGradient>\n            <\u002Fdefs>\n            <!-- forecast curve 06:00 → 24:00 -->\n            <path d=\"{{ arcFillD }}\" fill=\"url(#hxarc)\"><\u002Fpath>\n            <path d=\"{{ arcPastD }}\" fill=\"none\" stroke=\"#4DE1C4\" stroke-width=\"2\"><\u002Fpath>\n            <path d=\"{{ arcLineD }}\" fill=\"none\" stroke=\"#4DE1C4\" stroke-width=\"2\" stroke-dasharray=\"1.5 5\" stroke-linecap=\"round\" opacity=\"0.75\"><\u002Fpath>\n            <!-- now marker -->\n            <line x1=\"118\" y1=\"8\" x2=\"118\" y2=\"90\" stroke=\"#f1f4f8\" stroke-width=\"1\" stroke-dasharray=\"2 3\" opacity=\"0.5\"><\u002Fline>\n            <circle cx=\"118\" cy=\"36\" r=\"4\" fill=\"#f1f4f8\"><\u002Fcircle>\n            <!-- event dots -->\n            <circle cx=\"22\" cy=\"42\" r=\"3.5\" fill=\"var(--hx-accent)\"><\u002Fcircle>\n            <circle cx=\"160\" cy=\"48\" r=\"3.5\" fill=\"#F5C451\"><\u002Fcircle>\n            <circle cx=\"{{ sleepX }}\" cy=\"{{ sleepDotY }}\" r=\"3.5\" fill=\"#82a0da\"><\u002Fcircle>\n          <\u002Fsvg>\n          <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"1\">\n            <div style=\"position: absolute; left: {{ p.leftPct }}; top: {{ p.topPct }}; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 999px; background: {{ p.color }};\"><\u002Fdiv>\n          <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; font-size: 9px; color: #6b7585; margin-top: 2px;\"><span>06<\u002Fspan><span>09<\u002Fspan><span>12<\u002Fspan><span>15<\u002Fspan><span>18<\u002Fspan><span>21<\u002Fspan><span>24<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;\">\n            <span style=\"display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #cdd8ea; background: #1a212c; border-radius: 999px; padding: 4px 9px;\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: var(--hx-accent);\"><\u002Fspan>06:19 gym ✓<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #cdd8ea; background: #1a212c; border-radius: 999px; padding: 4px 9px;\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: #F5C451;\"><\u002Fspan>14:00 caffeine cutoff<\u002Fspan>\n            <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"1\">\n            <span style=\"display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #cdd8ea; background: #1a212c; border-radius: 999px; padding: 4px 9px;\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: {{ p.color }};\"><\u002Fspan>{{ p.time }} {{ p.chipLabel }}<\u002Fspan>\n            <\u002Fsc-for>\n            <span style=\"display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #cdd8ea; background: #1a212c; border-radius: 999px; padding: 4px 9px;\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: #82a0da;\"><\u002Fspan>{{ sleepTime }} lights out<\u002Fspan>\n          <\u002Fdiv>\n          <!-- evening planner -->\n          <div style=\"margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05);\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n              <span style=\"font-size: 11px; font-weight: 700; color: #cdd8ea;\">Planned for later<\u002Fspan>\n              <span style=\"font-size: 10px; color: #6b7585;\">‹ › move · × drop<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 6px; margin-top: 10px;\">\n              <sc-for list=\"{{ plans }}\" as=\"p\" hint-placeholder-count=\"1\">\n                <div style=\"display: flex; align-items: center; gap: 8px; background: #1a212c; border-radius: 12px; padding: 7px 8px 7px 11px;\">\n                  <span style=\"width: 7px; height: 7px; border-radius: 999px; background: {{ p.color }}; flex: none;\"><\u002Fspan>\n                  <span style=\"flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: #f1f4f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ p.label }} <span style=\"font-size: 9.5px; color: #6b7585; font-weight: 500;\">{{ p.note }}<\u002Fspan><\u002Fspan>\n                  <span sc-camel-on-click=\"{{ p.earlier }}\" style=\"width: 24px; height: 24px; border-radius: 8px; background: #0e141d; display: flex; align-items: center; justify-content: center; color: #8b95a3; font-size: 13px; cursor: pointer; flex: none;\" style-hover=\"color: #f1f4f8\" style-active=\"transform: scale(0.88)\">‹<\u002Fspan>\n                  <span style=\"width: 38px; text-align: center; font-size: 11.5px; font-weight: 700; color: #cdd8ea; font-variant-numeric: tabular-nums; flex: none;\">{{ p.time }}<\u002Fspan>\n                  <span sc-camel-on-click=\"{{ p.later }}\" style=\"width: 24px; height: 24px; border-radius: 8px; background: #0e141d; display: flex; align-items: center; justify-content: center; color: #8b95a3; font-size: 13px; cursor: pointer; flex: none;\" style-hover=\"color: #f1f4f8\" style-active=\"transform: scale(0.88)\">›<\u002Fspan>\n                  <span sc-camel-on-click=\"{{ p.remove }}\" style=\"width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #6b7585; font-size: 14px; cursor: pointer; flex: none;\" style-hover=\"color: #FF6B6B\" style-active=\"transform: scale(0.88)\">×<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ noPlans }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: 11px; color: #6b7585; text-align: center; padding: 6px 0;\">Nothing planned — a full downshift evening.<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ pickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 10px; color: #6b7585; margin: 10px 2px 0;\">Your usuals — from the last 90 days of activity<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;\">\n                <sc-for list=\"{{ presets }}\" as=\"pr\" hint-placeholder-count=\"3\">\n                  <span sc-camel-on-click=\"{{ pr.add }}\" style=\"display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: #cdd8ea; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 7px 12px; cursor: pointer;\" style-hover=\"border-color: rgba(255,255,255,0.35)\" style-active=\"transform: scale(0.94)\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: {{ pr.color }};\"><\u002Fspan>+ {{ pr.label }} <span style=\"font-size: 9.5px; color: #6b7585; font-weight: 500;\">{{ pr.freq }}<\u002Fspan><\u002Fspan>\n                <\u002Fsc-for>\n                <span sc-camel-on-click=\"{{ goCoach }}\" style=\"font-size: 11.5px; font-weight: 600; color: #8b95a3; border: 1px dashed rgba(255,255,255,0.16); border-radius: 999px; padding: 7px 12px; cursor: pointer;\" style-hover=\"color: #cdd8ea; border-color: rgba(255,255,255,0.3)\" style-active=\"transform: scale(0.94)\">something else… tell coach<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div sc-camel-on-click=\"{{ togglePicker }}\" style=\"text-align: center; font-size: 11.5px; font-weight: 600; color: #8b95a3; border: 1px dashed rgba(255,255,255,0.16); border-radius: 999px; padding: 8px 0; margin-top: 10px; cursor: pointer;\" style-hover=\"color: #cdd8ea; border-color: rgba(255,255,255,0.3)\" style-active=\"transform: scale(0.98)\">{{ pickerToggleLabel }}<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; justify-content: space-between; margin-top: 10px; background: #1a212c; border-radius: 12px; padding: 9px 12px;\">\n              <span style=\"font-size: 11px; color: #8b95a3;\">Tomorrow's recovery forecast<\u002Fspan>\n              <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; color: {{ forecastColor }};\">{{ forecast }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,0.05);\">\n            <img src=\"ff494e79-0b9d-4aa3-8b82-a91933254ad5\" alt=\"\" style=\"width: 18px; height: 18px; border-radius: 999px; flex: none;\">\n            <span style=\"flex: 1; font-size: 11.5px; line-height: 1.45; color: #cdd8ea;\">{{ arcCoachMsg }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <\u002Fdiv>\n        <div style=\"order: {{ sec.training.order }}; display: {{ sec.training.disp }};\">\n        <!-- TRAINING -->\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin: 24px 2px 10px;\">\n          <span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #8b95a3;\">Training<\u002Fspan>\n          <span style=\"font-size: 11px; color: #6b7585;\">readiness-adjusted<\u002Fspan>\n        <\u002Fdiv>\n        <div data-hx-rise=\"3\" style=\"background: #0e141d; border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 16px; box-shadow: 0 18px 42px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between;\">\n            <div>\n              <div style=\"font-size: 11px; color: #8b95a3;\">Today's load budget<\u002Fdiv>\n              <div style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; color: #f1f4f8; letter-spacing: -0.5px; margin-top: 2px;\">{{ loadUsed }}<span style=\"font-size: 14px; color: #6b7585; font-family: -apple-system; font-weight: 600;\"> / {{ loadBudget }} used<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 11px; color: #F5C451; text-align: right;\">{{ loadLeftLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <!-- stacked budget bar -->\n          <div style=\"display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; margin-top: 12px; background: #1a212c;\">\n            <sc-for list=\"{{ activities }}\" as=\"act\" hint-placeholder-count=\"3\">\n              <div style=\"width: {{ act.pct }}; height: 100%; background: {{ act.color }}; opacity: {{ act.opacity }};\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <!-- activity stack -->\n          <div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 12px;\">\n            <sc-for list=\"{{ activities }}\" as=\"act\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cdd8ea; padding: 4px 0; cursor: pointer; border-radius: 8px;\" style-hover=\"background: rgba(255,255,255,0.03)\" style-active=\"transform: scale(0.99)\">\n                <span style=\"width: 8px; height: 8px; border-radius: 2px; background: {{ act.color }}; flex: none;\"><\u002Fspan>\n                <span style=\"flex: 1;\">{{ act.label }}<\u002Fspan>\n                <span style=\"font-size: 10px; color: #6b7585; text-transform: uppercase; letter-spacing: 0.5px;\">{{ act.category }}<\u002Fspan>\n                <span style=\"width: 34px; text-align: right; font-variant-numeric: tabular-nums; color: #8b95a3;\">{{ act.load }}<\u002Fspan>\n                <span style=\"color: #6b7585;\">›<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <!-- 7-day load vs optimal band -->\n          <div style=\"position: relative; height: 46px; margin-top: 14px;\">\n            <div style=\"position: absolute; left: 0; right: 0; top: 12px; height: 16px; background: rgba(255,255,255,0.05); border-top: 1px dashed rgba(255,255,255,0.16); border-bottom: 1px dashed rgba(255,255,255,0.16);\"><\u002Fdiv>\n            <div style=\"position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 6px;\">\n              <div style=\"flex: 1; height: 40%; background: #1a212c; border-radius: 3px;\"><\u002Fdiv>\n              <div style=\"flex: 1; height: 52%; background: #1a212c; border-radius: 3px;\"><\u002Fdiv>\n              <div style=\"flex: 1; height: 34%; background: #1a212c; border-radius: 3px;\"><\u002Fdiv>\n              <div style=\"flex: 1; height: 66%; background: #1a212c; border-radius: 3px;\"><\u002Fdiv>\n              <div style=\"flex: 1; height: 58%; background: #1a212c; border-radius: 3px;\"><\u002Fdiv>\n              <div style=\"flex: 1 ht: 600; color: #cdd8ea; font-variant-numeric: tabular-nums;\">13.8 /min<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(245,196,81,0.04);\" style-hover=\"background: rgba(245,196,81,0.07)\">\n            <span style=\"width: 88px; flex: none; font-size: 13px; font-weight: 600; color: #F5C451;\">Skin temp<\u002Fspan>\n            <div style=\"flex: 1; position: relative; height: 7px; background: #1a212c; border-radius: 5px;\"><div style=\"position: absolute; top: 0; bottom: 0; left: 28%; right: 34%; background: rgba(255,255,255,0.06); border-left: 1.5px dashed #6b7585; border-right: 1.5px dashed #6b7585;\"><\u002Fdiv><div style=\"position: absolute; top: -2px; bottom: -2px; left: 78%; width: 3px; border-radius: 2px; background: #F5C451;\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"width: 62px; flex: none; text-align: right; font-size: 12.5px; font-weight: 600; color: #F5C451; font-variant-numeric: tabular-nums;\">+0.3 °C<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-top: 1px solid rgba(255,255,255,0.05);\" style-hover=\"background: rgba(255,255,255,0.02)\">\n            <span style=\"width: 88px; flex: none; font-size: 13px; font-weight: 600; color: #f1f4f8;\">Blood press.<\u002Fspan>\n            <div style=\"flex: 1; position: relative; height: 7px; background: #1a212c; border-radius: 5px;\"><div style=\"position: absolute; top: 0; bottom: 0; left: 20%; right: 35%; background: rgba(255,255,255,0.06); border-left: 1.5px dashed #6b7585; border-right: 1.5px dashed #6b7585;\"><\u002Fdiv><div style=\"position: absolute; top: -2px; bottom: -2px; left: 42%; width: 3px; border-radius: 2px; background: #f1f4f8;\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"width: 62px; flex: none; text-align: right; font-size: 12.5px; font-weight: 600; color: #cdd8ea; font-variant-numeric: tabular-nums;\">118/76<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-start; gap: 9px; padding: 12px 15px; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(245,196,81,0.04);\">\n            <img src=\"ff494e79-0b9d-4aa3-8b82-a91933254ad5\" alt=\"\" style=\"width: 18px; height: 18px; border-radius: 999px; flex: none; margin-top: 1px;\">\n            <span style=\"flex: 1; font-size: 11.5px; line-height: 1.45; color: #cdd8ea;\">Skin temp is +0.3 °C above your band. Alone it's noise; with tonight's HRV it becomes signal — I'll check both at 6 am and flag anything before you feel it.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 10.5px; color: #6b7585; margin: 8px 4px 0;\">Shaded = your normal range · marker = today. Tap any metric for what it means.<\u002Fdiv>\n\n        <\u002Fdiv>\n        <div style=\"order: {{ sec.patterns.order }}; display: {{ sec.patterns.disp }};\">\n        <!-- PATTERNS -->\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin: 24px 2px 10px;\">\n          <span style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #8b95a3;\">Patterns in your data<\u002Fspan>\n          <span style=\"font-size: 11px; color: #6b7585;\">found overnight, no need to ask<\u002Fspan>\n        <\u002Fdiv>\n        <!-- AI-suggested hypotheses -->\n        <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;\">\n          <sc-for list=\"{{ patSuggestions }}\" as=\"ps\" hint-placeholder-count=\"2\">\n            <div style=\"background: linear-gradient(160deg, #0e141d, #0c1219); border: 1px dashed rgba(77,225,196,0.35); border-radius: 18px; padding: 13px 14px;\">\n              <div style=\"display: flex; align-items: center; gap: 8px;\">\n                <img src=\"ff494e79-0b9d-4aa3-8b82-a91933254ad5\" alt=\"\" style=\"width: 18px; height: 18px; border-radius: 999px; flex: none;\">\n                <span style=\"flex: 1; font-size: 12.5px; font-weight: 700; color: #f1f4f8;\">{{ ps.pair }}<\u002Fspan>\n                <span style=\"font-size: 9.5px; font-weight: 700; color: {{ ps.confColor }}; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 3px 8px; flex: none;\">{{ ps.conf }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size: 11.5px; line-height: 1.5; color: #cdd8ea; margin-top: 8px;\">{{ ps.hyp }}<\u002Fdiv>\n              <sc-if value=\"{{ ps.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background: #1a212c; border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 11.5px; line-height: 1.55; color: #cdd8ea;\">{{ ps.detail }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display: flex; gap: 8px; margin-top: 10px;\">\n                <span sc-camel-on-click=\"{{ ps.toggle }}\" style=\"flex: 1; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--hx-accent-ink); border: 1px solid rgba(77,225,196,0.4); border-radius: 999px; padding: 7px 0; cursor: pointer;\" style-active=\"transform: scale(0.96)\">Dig in<\u002Fspan>\n                <span sc-camel-on-click=\"{{ goCoach }}\" style=\"flex: 1; text-align: center; font-size: 11.5px; font-weight: 700; color: #cdd8ea; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 7px 0; cursor: pointer;\" style-active=\"transform: scale(0.96)\">Ask coach<\u002Fspan>\n                <span sc-camel-on-click=\"{{ ps.dismiss }}\" style=\"width: 68px; text-align: center; font-size: 11.5px; font-weight: 600; color: #6b7585; border: 1px solid rgba(255,255,255,0.10); border-radius: 999px; padding: 7px 0; cursor: pointer;\" style-hover=\"color: #FF6B6B\" style-active=\"transform: scale(0.96)\">Not useful<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n ne;\">\n            <span style=\"flex: 1; font-size: 11.5px; line-height: 1.5; color: #cdd8ea;\">Above 86 kg your oxygen dips below 92% get more frequent — the red dot is last night. Losing the next kilo is a breathing intervention, not a vanity one. <span sc-camel-on-click=\"{{ askSpo2w }}\" style=\"color: var(--hx-accent-ink); font-weight: 600; cursor: pointer;\">Ask coach →<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showPatB }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: #0e141d; border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 15px 16px; margin-top: 10px; box-shadow: 0 18px 42px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n            <span style=\"font-size: 13px; font-weight: 700; color: #f1f4f8;\">Resting HR <span style=\"color: #6b7585; font-weight: 500;\">vs<\u002Fspan> next-day recovery<\u002Fspan>\n            <span style=\"font-size: 10.5px; font-weight: 700; color: #FF6B6B; background: rgba(255,107,107,0.10); border: 1px solid rgba(255,107,107,0.25); border-radius: 999px; padding: 3px 9px;\">strong link · 14 days<\u002Fspan>\n            <span sc-camel-on-click=\"{{ dismissPatB }}\" style=\"font-size: 10.5px; font-weight: 700; color: #6b7585; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 3px 9px; cursor: pointer; flex: none; margin-left: 6px;\" style-hover=\"color: #f1f4f8\">Got it ×<\u002Fspan>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 330 92\" width=\"100%\" height=\"92\" style=\"display: block; margin-top: 10px;\">\n            <line x1=\"30\" y1=\"10\" x2=\"316\" y2=\"76\" stroke=\"#FF6B6B\" stroke-width=\"1.2\" stroke-dasharray=\"3 4\" opacity=\"0.6\"><\u002Fline>\n            <circle cx=\"42\" cy=\"14\" r=\"3\" fill=\"#FF6B6B\" opacity=\"0.85\"><\u002Fcircle>\n Coach }}\" style=\"flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: #cdd8ea; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 10px 0; cursor: pointer;\" style-active=\"transform: scale(0.97)\">Adjust with coach<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- HRV deep-dive sheet -->\n    <sc-if value=\"{{ showHrvSheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end;\">\n      <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position: absolute; inset: 0; background: rgba(2,4,8,0.62); backdrop-filter: blur(2px);\"><\u002Fdiv>\n      <div style=\"position: relative; background: #0c1219; border: 1px solid rgba(255,255,255,0.10); border-bottom: none; border-radius: 28px 28px 54px 54px; padding: 14px 18px 26px; animation: hx-rise 0.35s cubic-bezier(.4,0,.2,1); max-height: 78%; overflow-y: auto;\" class=\"hx\">\n        <div style=\"width: 36px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.16); margin: 0 auto 12px;\"><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n          <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; color: #f1f4f8;\">HRV<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeSheet }}\" style=\"width: 28px; height: 28px; border-radius: 999px; background: #1a212c; display: flex; align-items: center; justify-content: center; color: #8b95a3; font-size: 15px; cursor: pointer;\" style-active=\"transform: scale(0.9)\">×<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: flex-end; gap: 10px; margin-top: 4px;\">\n          <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 38px; font-weight: 800; line-height: 1; color: #f1f4f8; letter-spacing: -1px;\">38.3<span style=\"font-size: 15px; color: #6b7585; font-family: -apple-system; font-weight: 600;\"> ms<\u002Fspan><\u002Fspan>\n          <span style=\"font-size: 11.5px; color: #FF6B6B; font-weight: 700; margin-bottom: 4px;\">▼ 12% vs your band<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background: #1a212c; border-radius: 14px; padding: 11px 13px; margin-top: 12px;\">\n          <div style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: #8b95a3;\">What you're seeing<\u002Fdiv>\n          <div style=\"font-size: 11.5px; line-height: 1.55; color: #cdd8ea; margin-top: 5px;\">HRV is the tiny variation in time between your heartbeats. Bigger variation = your nervous system is relaxed and ready; smaller = it's under strain. <span style=\"color: #FF6B6B; font-weight: 700;\">▼ 12%<\u002Fspan> means last night's reading sits 12% below <em>your own<\u002Fem> 30-day normal band — so your body has less recovery capacity today than usual. It's compared to you, not to other people.<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- 30-day chart with band -->\n        <div style=\"position: relative; height: 84px; margin-top: 14px;\">\n          <div style=\"position: absolute; left: 0; right: 0; top: 26px; height: 26px; background: rgba(77,225,196,0.07); border-top: 1px dashed rgba(77,225,196,0.4); border-bottom: 1px dashed rgba(77,225,196,0.4);\"><\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 330 84\" width=\"100%\" height=\"84\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: relative;\">\n            <polyline points=\"0,38 22,34 44,42 66,36 88,30 110,40 132,35 154,44 176,38 198,46 220,42 242,50 264,47 286,55 308,58 330,62\" fill=\"none\" stroke=\"#cdd8ea\" stroke-width=\"1.8\"><\u002Fpolyline>\n            <circle cx=\"330\" cy=\"62\" r=\"3.5\" fill=\"#FF6B6B\"><\u002Fcircle>\n          <\u002Fsvg>\n          <span style=\"position: absolute; right: 2px; top: 20px; font-size: 9px; color: var(--hx-accent-ink);\">your band           <span style=\"flex: 1; font-size: 11.5px; line-height: 1.5; color: #cdd8ea;\">This is a loading dip, not a health signal — it tracks your training block, and your rebound after easy days is reliable. Watch it tomorrow after tonight's downshift.<\u002Fspan>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ askHrv }}\" style=\"text-align: center; font-size: 12px; font-weight: 700; color: #04201f; background: linear-gradient(150deg,#4DE1C4,#12A5C8); border-radius: 999px; padding: 10px 0; margin-top: 12px; cursor: pointer;\" style-active=\"transform: scale(0.97)\">Ask coach about this<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- generic metric insight sheet -->\n    <sc-if value=\"{{ showMetricSheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end;\">\n      <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position: absolute; inset: 0; background: rgba(2,4,8,0.62); backdrop-filter: blur(2px);\"><\u002Fdiv>\n      <div style=\"position: relative; background: #0c1219; border: 1px solid rgba(255,255,255,0.10); border-bottom: none; border-radius: 28px 28px 54px 54px; padding: 14px 18px 26px; animation: hx-rise 0.35s cubic-bezier(.4,0,.2,1); max-height: 78%; overflow-y: auto;\" class=\"hx\">\n        <div style=\"width: 36px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.16); margin: 0 auto 12px;\"><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n          <span style=\"font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; color: #f1f4f8;\">{{ miLabel }}<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeSheet }}\" style=\"width: 28px; height: 28px; border-radius: 999px; background: #1a212c; display: flex; align-items: center; justify-content: center; color: #8b95a3; font-size: 15px; cursor: poin play: flex; gap: 12px; font-size: 11px; color: #8b95a3; font-variant-numeric: tabular-nums;\">\n            <span>~820 kcal<\u002Fspan><span style=\"color: #cdd8ea;\">P 42<\u002Fspan><span style=\"color: #5BA9F0;\">C 96<\u002Fspan><span style=\"color: #F5C451;\">F 28<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 7px; font-size: 11px; line-height: 1.45; color: #5FD17A; background: rgba(95,209,122,0.08); border-radius: 10px; padding: 8px 10px;\">\n            <img src=\"ff494e79-0b9d-4aa3-8b82-a91933254ad5\" alt=\"\" style=\"width: 15px; height: 15px; border-radius: 999px; flex: none;\">\n            <span>Brings protein to 54 / 180 g — right on pace for a training day.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 8px; margin-top: 2px;\">\n            <div sc-camel-on-click=\"{{ confirmMeal }}\" style=\"flex: 1; text-align: center; font-size: 12px; font-weight: 700; color: #04201f; background: linear-gradient(150deg,#4DE1C4,#12A5C8); border-radius: 999px; padding: 9px 0; cursor: pointer;\" style-active=\"transform: scale(0.97)\">Log it<\u002Fdiv>\n            <div style=\"flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: #cdd8ea; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 9px 0; cursor: pointer;\" style-active=\"transform: scale(0.97)\">Not quite…<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- usual meals -->\n        <div style=\"font-size: 10px; color: #6b7585; margin: 12px 2px 6px;\">Or one-tap a usual lunch<\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n          <span style=\"font-size: 11.5px; font-weight: 600; color: #cdd8ea; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 7px 12px; cursor: pointer;\" style-hover=\"border-color: rgba(255,255,255,0.35)\" style-active=\"transform: scale(0.94)\">Chicken bowl <span style=\"color: #6b7585; font-size: 9.5px;\">×8<\u002Fspan><\u002Fspan>\n          <span style=\"font-size: 11.5px; font-weight: 600; color: #cdd8ea; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 7px 12px; cursor: pointer;\" style-hover=\"border-color: rgba(255,255,255,0.35)\" style-active=\"transform: scale(0.94)\">Eggs + toast <span style=\"color: #6b7585; font-size: 9.5px;\">×6<\u002Fspan><\u002Fspan>\n          <span style=\"font-size: 11.5px; font-weight: 600; color: #cdd8ea; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; padding: 7px 12px; cursor: pointer;\" style-hover=\"border-color: rgba(255,255,255,0.35)\" style-active=\"transform: scale(0.94)\">Poke bowl <span style=\"color: #6b7585; font-size: 9.5px;\">×4<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- bottom nav -->\n    <div style=\"flex: none; height: 82px; border-top: 1px solid rgba(255,255,255,0.07); background: rgba(7,11,17,0.86); backdrop-filter: blur(14px); display: flex; align-items: flex-start; padding: 12px 10px 0; box-shadow: 0 -22px 50px -18px rgba(0,0,0,0.55); position: relative;\">\n      <div sc-camel-on-click=\"{{ goToday }}\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;\">\n        <div style=\"width: 44px; height: 28px; border-radius: 999px; background: {{ todayPillBg }}; display: flex; align-items: center; justify-content: center;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"{{ todayColor }}\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"{{ todayColor }}\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <span style=\"font-size: 10px; font-weight: 700; color: {{ todayColor }};\">Today<\u002Fspan>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goCoach }}\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;\">\n        <div style=\"width: 44px; height: 28px; border-radius: 999px; background: {{ coachPillBg }}; display: flex; align-items: center; justify-content: center;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"{{ coachColor }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6 h16 v10 h-9 l-4 4 v-4 h-3 z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <span style=\"font-size: 10px; font-weight: 700; color: {{ coachColor }};\">Coach<\u002Fspan>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goLog }}\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;\">\n        <div style=\"width: 44px; height: 28px; border-radius: 999px; background: {{ logPillBg }}; display: flex; align-items: center; justify-content: center;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"{{ logColor }}\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 8.5 v7 M8.5 12 h7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <span style=\"font-size: 10px; font-weight: 700; color: {{ logColor }};\">Log<\u002Fspan>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goMe }}\" style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;\">\n        <div style=\"width: 44px; height: 28px; border-radius: 999px; background: {{ mePillBg }}; display: flex; align-items: center; justify-content: center;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"19\" height=\"19\" fill=\"none\" stroke=\"{{ meColor }}\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M5 20 c1.5 -4 4 -5.5 7 -5.5 s5.5 1.5 7 5.5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <span style=\"font-size: 10px; font-weight: 700; color: {{ meColor }};\">Me<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 880}, &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#22C7C0&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#22C7C0&quot;, &quot;#F83058&quot;, &quot;#5BA9F0&quot;, &quot;#B78BFA&quot;], &quot;section&quot;: &quot;Theme&quot;}, &quot;motion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.applyAccent();\n    if (this.props.motion === false) return;\n    const ease = 'cubic-bezier(.4,0,.2,1)';\n    // staggered card entrance\n    document.querySelectorAll('[data-hx-rise]').forEach((el) => {\n      const i = +el.getAttribute('data-hx-rise');\n      el.animate(\n        [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0)' }],\n        { duration: 500, delay: 80 * i, easing: ease, fill: 'backwards' }\n      );\n    });\n    // ring sweeps\n    document.querySelectorAll('[data-hx-ring]').forEach((el) => {\n      el.animate(\n        [{ strokeDashoffset: 188.5 }, { strokeDashoffset: +el.getAttribute('data-hx-ring') }],\n        { duration: 900, delay: 200, easing: ease, fill: 'backwards' }\n      );\n    });\n    // macro bars grow\n    document.querySelectorAll('[data-hx-bar]').forEach((el) => {\n      el.animate([{ width: '0%' }, { width: el.getAttribute('data-hx-bar') + '%' }],\n        { duration: 700, delay: 350, easing: ease, fill: 'backwards' });\n    });\n    // number count-ups\n    document.querySelectorAll('[data-hx-count]').forEach((el) => {\n      const target = +el.getAttribute('data-hx-count');\n      const t0 = performance.now(), dur = 900;\n      const tick = (t) => {\n        const p = Math.min(1, (t - t0) / dur);\n        const e = 1 - Math.pow(1 - p, 3);\n        el.textContent = Math.round(target * e);\n        if (p < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    });\n  }\n  componentDidUpdate() { this.applyAccent(); }\n  applyAccent() {\n    const map = {\n      '#22C7C0': ['#22C7C0', '#58E0D6', 'rgba(34,199,192,0.15)'],\n      '#F83058': ['#F83058', '#FF8098', 'rgba(248,48,88,0.15)'],\n      '#5BA9F0': ['#5BA9F0', '#8FC4F5', 'rgba(91,169,240,0.15)'],\n      '#B78BFA': ['#B78BFA', '#CDAFFB', 'rgba(183,139,250,0.15)'],\n    };\n    const [a, ink, soft] = map[this.props.accent] || map['#22C7C0'];\n    const r = document.documentElement.style;\n    r.setProperty('--hx-accent', a);\n    r.setProperty('--hx-accent-ink', ink);\n    r.setProperty('--hx-accent-soft', soft);\n  }\n  state = { tab: 'today', ctx: null, pickerOpen: false, plans: [{ id: 1, type: 'pickleball', hour: 18.5, note: 'unconfirmed · from chat' }] };\n  movePlan(id, dh) {\n    this.setState((s) => ({ plans: s.plans.map((p) => p.id === id ? Object.assign({}, p, { hour: Math.min(21.5, Math.max(15, p.hour + dh)) }) : p) }));\n  }\n  addPlan(type) {\n    const def = { pickleball: 18.5, run: 18, strength: 17.5, sauna: 20.5, drinks: 20, dinner: 19.5 };\n    this.setState((s) => ({ plans: s.plans.concat([{ id: Date.now(), type, hour: def[type] }]) }));\n  }\n  renderVals() {\n    const tab = this.state.tab;\n    // --- evening planner ---\n    const X = (h) => Math.round(((h - 6) / 18) * 330);\n    const fmt = (h) => Math.floor(h) + ':' + (h % 1 ? '30' : '00');\n    const kinds = {\n      pickleball: { label: 'Pickleball', color: '#B78BFA', peakY: 34, load: 7, cat: 'mixed', training: true },\n      run: { label: 'Easy run', color: '#5BA9F0', peakY: 30, load: 8, cat: 'cardio', training: true },\n      strength: { label: 'Strength', color: '#22C7C0', peakY: 28, load: 10, cat: 'strength', training: true },\n      sauna: { label: 'Sauna', color: '#5FD17A', peakY: 58, load: 2, cat: 'recovery', training: false },\n      drinks: { label: 'Drinks', color: '#FF6B6B', peakY: 50, load: 0, cat: '', training: false },\n      dinner: { label: 'Dinner out', color: '#F5C451', peakY: 52, load: 0, cat: '', training: false },\n    };\n    const sorted = this.state.plans.slice().sort((a, b) => a.hour - b.hour);\n    let sleepHour = 22.5;\n    let forecast = 74;\n    let hasDrinks = false;\n    sorted.forEach((p) => {\n      const k = kinds[p.type];\n      if (k.training) { sleepHour = Math.max(sleepHour, p.hour + 4); forecast -= Math.max(0, p.hour - 17.5) * 4; }\n      if (p.type === 'sauna') forecast += 2;\n      if (p.type === 'drinks') { hasDrinks = true; forecast -= 7 + Math.max(0, p.hour - 18); }\n      if (p.type === 'dinner' && p.hour >= 20) forecast -= 1;\n    });\n    sleepHour = Math.min(24, sleepHour);\n    forecast = Math.round(Math.min(78, Math.max(42, forecast)));\n    const endY = Math.round(Math.min(92, Math.max(72, 84 + (74 - forecast) * 0.5)));\n    let sleepX = X(sleepHour);\n    const sleepDotY = endY - 6;\n    const arcPastD = 'M0,64 C 30,30 55,22 85,26 C 98,28 108,32 118,36';\n    let d = 'M118,36 C 132,42 146,46 160,48';\n    let px = 160, py = 48;\n    sorted.forEach((p) => {\n      const k = kinds[p.type];\n      const x = Math.max(px + 10, X(p.hour));\n      const mx = Math.round(px + (x - px) / 2);\n      d += ' C ' + mx + ',' + py + ' ' + mx + ',' + k.peakY + ' ' + x + ',' + k.peakY;\n      px = x; py = k.peakY;\n    });\n    sleepX = Math.max(px + 10, sleepX);\n    const smx = Math.round(px + (sleepX - px) / 2);\n    d += ' C ' + smx + ',' + py + ' ' + smx + ',' + sleepDotY + ' ' + sleepX + ',' + sleepDotY;\n    if (sleepX < 328) d += ' C ' + (sleepX + 10) + ',' + (endY - 3) + ' 320,' + endY + ' 330,' + endY;\n    const arcCoachMsg = hasDrinks\n      ? 'Drinks tonight — expect ~15% less deep sleep and +2 bpm resting HR. Water between rounds and a 23:00 cutoff contains the damage. Forecast ' + forecast + '.'\n      : sorted.length === 0\n        ? 'Nothing planned — a quiet evening and 22:30 lights-out is your fastest flip for a 62-recovery day. Forecast ' + forecast + '.'\n        : forecast >= 70\n          ? 'Light evening. Lights-out around ' + fmt(sleepHour) + ' and tomorrow rebounds to ~' + forecast + '. Room for a bit more if you feel good.'\n          : forecast >= 63\n            ? 'Manageable — but finish the hard stuff early. Every 30 min later costs ~2\\u20133 recovery points. Forecast ' + forecast + '.'\n            : 'That\\u2019s a heavy evening on a 62-recovery day — your HR won\\u2019t settle before bed. Forecast ' + forecast + '. I\\u2019d move or drop one.';\n    const planRows = sorted.map((p) => {\n      const k = kinds[p.type];\n      return {\n        label: k.label,\n        note: p.note || '',\n        color: k.color,\n        time: fmt(p.hour),\n        chipLabel: k.label.toLowerCase() + (p.note ? '?' : ''),\n        leftPct: ((Math.max(168, X(p.hour)) / 330) * 100).toFixed(1) + '%',\n        topPct: ((k.peakY / 96) * 100).toFixed(1) + '%',\n        earlier: () => this.movePlan(p.id, -0.5),\n        later: () => this.movePlan(p.id, 0.5),\n        remove: () => this.setState((s) => ({ plans: s.plans.filter((q) => q.id !== p.id) })),\n      };\n    });\n    const freq = { strength: '×14', run: '×9', pickleball: '×7', sauna: '×5', dinner: '×4', drinks: '×3' };\n    const presets = Object.keys(kinds)\n      .sort((a, b) => parseInt(freq[b].slice(1)) - parseInt(freq[a].slice(1)))\n      .map((t) => ({ label: kinds[t].label, color: kinds[t].color, freq: freq[t], add: () => this.addPlan(t) }));\n    // --- coach context threads ---\n    const ctxMap = {\n      stress: { dot: '#FF6B6B', label: 'Stress', value: '82 \\u00b7 high, sympathetic',\n        msg: 'That 82 tracks with your morning: strength at 6:19, two espressos by 9:40, and no real break since. It\\u2019s sympathetic drive, not danger — but stacked on 62 recovery it\\u2019s worth discharging before pickleball. Got 3 minutes for a physiological-sigh reset?',\n        chip1: 'Guide me through it now', chip2: 'Is this hurting tonight\\u2019s sleep?' },\n      battery: { dot: '#cdd8ea', label: 'Body Battery', value: '34% \\u00b7 draining fast',\n        msg: 'You\\u2019re burning charge ~20% faster than a typical Thursday — the 6 am session plus this morning\\u2019s stress is the combo. Protect a quiet block from 14:30\\u201315:00 and you\\u2019ll walk into pickleball with ~25% instead of ~15%.',\n        chip1: 'Block 14:30 in my calendar', chip2: 'What drains me most?' },\n      load: { dot: '#5FD17A', label: 'Load', value: '46 of 62 \\u00b7 on track',\n        msg: 'You\\u2019ve banked 31 of today\\u2019s 38-point budget — the morning session was the big spend. If pickleball happens at 18:30 you\\u2019ll land right at the ceiling, which is fine once. It\\u2019s doing it three days straight that digs the hole.',\n        chip1: 'Show my 7-day trend', chip2: 'Plan a deload day' },\n      sleep: { dot: '#82a0da', label: 'Sleep', value: '74 \\u00b7 debt \\u22122h04',\n        msg: 'The debt built up over three short nights, not one bad one — that\\u2019s why you feel it in the afternoons. You don\\u2019t need to repay it all: two nights at your 22:40 lights-out clears ~80% of the performance cost.',\n        chip1: 'Build my repayment plan', chip2: 'Why do I wake at 4am?' },\n      hrv: { dot: '#FF6B6B', label: 'HRV', value: '38.3 ms \\u00b7 12% under band',\n        msg: 'Your HRV slide lines up with the 18% jump in training load — it\\u2019s adaptation strain, not illness (skin temp and resp rate would move together if it were). Hold aerobic-only until it re-enters your band; based on past blocks that\\u2019s 2\\u20133 easy days.',\n        chip1: 'Show me past blocks like this', chip2: 'What if it keeps dropping?' },\n      spo2w: { dot: '#5BA9F0', label: 'SpO\\u2082 \\u00d7 Weight', value: 'r \\u22120.55 \\u00b7 90 nights',\n        msg: 'Every kilo above 86 costs you overnight oxygen: your SpO\\u2082 minimums drop as weight rises, and below 86 kg the 91\\u201392% dips almost disappear. That pattern (with your snoring reports) is worth a sleep-apnea conversation with your doctor \\u2014 and it makes the last 2 kg less about the mirror, more about breathing.',\n        chip1: 'What flips first if I lose 1 kg?', chip2: 'Prep questions for my doctor' },\n      rhrrec: { dot: '#FF6B6B', label: 'Resting HR \\u00d7 Recovery', value: 'r \\u22120.89 \\u00b7 14 days',\n        msg: 'This is your tightest pattern: every 1 bpm your resting HR rises, recovery drops ~7 points the same morning. RHR moves before you feel anything \\u2014 so an evening reading of 56+ is your early warning to cancel the morning session before your body cancels it for you.',\n        chip1: 'Alert me when RHR hits 56', chip2: 'What drives my RHR up?' },\n      recovery: { dot: '#F5C451', label: 'Recovery', value: '62 \\u00b7 below base',\n        msg: '62 isn\\u2019t a rest-day verdict — it\\u2019s a keep-it-aerobic day. The drivers: 1h12 sleep debt and an 18% overnight HR dip (your norm is 25%). One early night usually flips this; your rebound pattern is strong.',\n        chip1: 'What flips it fastest?', chip2: 'Plan my evening' },\n    };\n    const ctx = ctxMap[this.state.ctx];\n    const active = 'var(--hx-accent-ink)', idle = '#8b95a3';\n    // Category palette — every sport maps to one of four categories.\n    const catColor = { strength: 'var(--hx-accent)', cardio: '#5BA9F0', mixed: '#B78BFA', recovery: '#5FD17A' };\n    const budget = 38;\n    const raw = [\n      { label: 'Gym · strength 06:19', category: 'strength', load: 18, planned: false },\n      { label: 'Walks · 4 × 15 min', category: 'cardio', load: 6, planned: false },\n    ];\n    sorted.forEach((p) => {\n      const k = kinds[p.type];\n      if (k.load > 0) raw.push({ label: k.label + (p.note ? '?' : '') + ' · ' + fmt(p.hour) + (p.note ? ' · unconfirmed' : ''), category: k.cat, load: k.load, planned: true });\n    });\n    const used = raw.reduce((s, a) => s + a.load, 0);\n    const left = budget - used;\n    // --- plain-language metric insights ---\n    const metricInfo = {\n      rhr: { label: 'Resting HR', value: '54', unit: ' bpm', delta: '\\u25b2 2 bpm vs baseline', deltaColor: '#F5C451',\n        what: 'Your heart rate at complete rest, measured while you sleep. It rises when your body is working on something \\u2014 training load, alcohol, short sleep, illness.',\n        means: '2 bpm above your usual 52 is a mild elevation. Together with the HRV dip it reads as \\u201cstill absorbing the training block\\u201d \\u2014 not illness. One easy evening usually brings it back.' },\n      rec: { label: 'HR recovery', value: '31', unit: ' bpm/min', delta: '\\u25b2 3 vs baseline', deltaColor: '#5FD17A',\n        what: 'How fast your heart rate falls in the first minute after hard effort. Faster drop = fitter, better-recovered heart.',\n        means: 'Up 3 on your baseline \\u2014 your aerobic engine is improving even while HRV dips. That combination is the signature of productive training, not overreaching.' },\n      bp: { label: 'Blood pressure', value: '118/76', unit: '', delta: 'in your band \\u2713', deltaColor: '#8b95a3',\n        what: 'Artery pressure when your heart beats (118) and rests (76). The metric here that matters most for long-term heart health \\u2014 and the least about today.',\n        means: 'Squarely in your normal band. Helix watches the 90-day trend, not single readings \\u2014 nothing to act on.' },\n      dur: { label: 'Sleep duration', value: '6h48', unit: '', delta: '\\u25bc 42 min vs need', deltaColor: '#F5C451',\n        what: 'Time actually asleep last night \\u2014 not time in bed. Your personal need, learned from your rebounds, is ~7h30.',\n        means: '42 minutes short. One short night is noise; it\\u2019s the third in a row that\\u2019s pushing your debt \\u2014 which is why afternoons feel heavy.' },\n      debt: { label: 'Sleep debt (7 d)', value: '\\u22122h04', unit: '', delta: 'growing', deltaColor: '#F5C451',\n        what: 'The running gap between the sleep you needed and the sleep you got over the last 7 nights. It behaves like a loan \\u2014 it compounds, but you don\\u2019t have to repay all of it.',\n        means: 'Two nights at your 22:40 lights-out clears ~80% of the performance cost. You don\\u2019t need a 10-hour catch-up sleep.' },\n      eff: { label: 'Sleep efficiency', value: '91', unit: ' %', delta: '\\u25b2 2% vs baseline', deltaColor: '#5FD17A',\n        what: 'The share of time in bed you were actually asleep. Above ~85% means falling asleep and staying asleep is not your problem.',\n        means: '91% says your sleep quality is fine \\u2014 your issue is purely quantity. Earlier lights-out, not sleep hygiene, is your lever.' },\n      cons: { label: 'Sleep consistency', value: '68', unit: ' /100', delta: '\\u25bc 9 vs baseline', deltaColor: '#FF6B6B',\n        what: 'How similar your bed and wake times are day to day. Your body clock rewards regularity almost as much as duration.',\n        means: 'The slide comes from two late nights this week. Irregular timing blunts deep sleep even when total hours look OK \\u2014 this is your cheapest win.' },\n      vo2: { label: 'VO\\u2082 max', value: '46.8', unit: '', delta: '\\u25b2 0.4 this month', deltaColor: '#5FD17A',\n        what: 'The maximum oxygen your body can use per minute \\u2014 the single best fitness number for long-term health. It moves slowly, over months.',\n        means: '46.8 puts you in the top ~20% for your age. The +0.4 says the training block is working; this is what you\\u2019re buying with the HRV dip.' },\n      load7: { label: 'Training load (7 d)', value: '212', unit: '', delta: '\\u25b2 18% vs your norm', deltaColor: '#F5C451',\n        what: 'Total training stress over the last 7 days, weighted by intensity. Compared against your 28-day norm \\u2014 ramping faster than ~10% is where injuries live.',\n        means: '+18% is a sharp ramp, and it\\u2019s the biggest driver of your HRV dip. Hold load flat this week and the recovery numbers follow.' },\n      steps: { label: 'Steps', value: '7,412', unit: '', delta: 'on pace \\u2713', deltaColor: '#8b95a3',\n        what: 'Background movement outside workouts. For you it mostly matters as a proxy for not sitting all day.',\n        means: 'On pace for your usual ~10k. No action needed \\u2014 your walks are already doing the job.' },\n      energy: { label: 'Active energy', value: '486', unit: ' kcal', delta: '\\u25b2 9% vs baseline', deltaColor: '#5FD17A',\n        what: 'Calories burned through movement, above what your body burns at rest.',\n        means: 'Running ~9% hot this week \\u2014 consistent with the heavier block. Worth matching with food: your protein target today assumes this burn.' },\n      weight: { label: 'Weight', value: '78.2', unit: ' kg', delta: '\\u25bc 0.4 kg (30 d)', deltaColor: '#5FD17A',\n        what: 'Morning weight, smoothed over days \\u2014 single readings swing \\u00b11 kg on water alone, so Helix only trends it.',\n        means: 'A slow \\u22120.4 kg over a heavy block while HR recovery improves = you\\u2019re losing fat, not muscle. Right direction, right speed.' },\n      fat: { label: 'Body fat', value: '14.6', unit: ' %', delta: 'in your band \\u2713', deltaColor: '#8b95a3',\n        what: 'Estimated fat share of body weight. Noisy day to day \\u2014 only the monthly trend means anything.',\n        means: 'Stable in your band. Combined with the weight trend, your composition is quietly improving.' },\n      temp: { label: 'Skin temp', value: '+0.3', unit: ' \\u00b0C dev', deltaColor: '#F5C451', delta: '\\u25b2 0.3\\u00b0 above band',\n        what: 'How far your overnight skin temperature sits from your personal norm. It
